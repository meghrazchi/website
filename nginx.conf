server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure relative redirects behind reverse proxies
    absolute_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression for Core Web Vitals speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # Next.js static assets
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff2?|txt|xml)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Next.js static-export routes
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}